name: SpikeNFC
options:
  bundleIdPrefix: com.davideghiotto
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: DA596D32QB
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  SpikeNFC:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davideghiotto.spikenfc
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NFCReaderUsageDescription: "The spike reads and writes NFC tags."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Sources/SpikeNFC.entitlements
