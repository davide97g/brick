server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Cloudflare terminates TLS in front of the tunnel; this only ever speaks HTTP to Traefik.
    absolute_redirect off;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;

    # add_header in a location replaces the server-level set, so each location carries all of it.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Assets are replaced, never edited in place, so they can be cached for a day.
    location /assets/ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
