name: Brick
options:
  bundleIdPrefix: com.davideghiotto
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: DA596D32QB
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    # One place for the version: the app and both extensions must ship the same
    # pair or App Store Connect rejects the bundle (ITMS-90473).
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
packages:
  BrickKit:
    path: BrickKit
targets:
  Brick:
    type: application
    platform: iOS
    sources:
      - Brick
      # Reverse mode makes the monitor apply a shield, not only clear one, so
      # the decoding lives in a file both targets compile.
      - Shared
    dependencies:
      - package: BrickKit
      - target: BrickMonitor
      - target: BrickShield
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davideghiotto.brick
        PRODUCT_NAME: Brick
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NFCReaderUsageDescription: "Brick reads your brick's NFC tag to start and end a session."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Without a brick, Face ID is what starts and ends a session."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # iPhone only: the product is a phone you walk away from, and iPad would
        # otherwise have to support every orientation.
        TARGETED_DEVICE_FAMILY: "1"
        # No encryption beyond Apple's own; declaring it here means App Store
        # Connect never asks the export-compliance question per upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Brick/Brick.entitlements

  BrickMonitor:
    type: app-extension
    platform: iOS
    sources:
      - BrickMonitor
      - Shared
    dependencies:
      - package: BrickKit
    info:
      path: BrickMonitor/Info.plist
      properties:
        CFBundleDisplayName: Brick Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).BrickMonitorExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davideghiotto.brick.monitor
        CODE_SIGN_ENTITLEMENTS: BrickMonitor/BrickMonitor.entitlements

  BrickShield:
    type: app-extension
    platform: iOS
    sources:
      - BrickShield
    dependencies:
      - package: BrickKit
    info:
      path: BrickShield/Info.plist
      properties:
        CFBundleDisplayName: Brick Shield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).BrickShieldExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davideghiotto.brick.shield
        CODE_SIGN_ENTITLEMENTS: BrickShield/BrickShield.entitlements
